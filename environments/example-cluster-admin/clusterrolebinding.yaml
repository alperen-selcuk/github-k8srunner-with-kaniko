# Dedicated cluster: the runner may deploy anything anywhere (namespaces, CRDs, cluster roles included)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gh-runner-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: gh-runner
  namespace: gh-runner
