apiVersion: v1
kind: ServiceAccount
metadata:
  name: gh-runner
  namespace: gh-runner
---
# Full deploy access limited to the runner's own namespace: the runner can deploy (kubectl/helm) there.
# The built-in "admin" role covers everything in the namespace incl. Roles/RoleBindings that helm charts
# often ship ("edit" would reject those). It grants nothing outside the namespace.
# For cluster-wide deploys switch to a ClusterRoleBinding (give it a unique name per install),
# and use "cluster-admin" if helm charts need cluster-scoped resources (CRDs, ClusterRoles, namespaces).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gh-runner-admin
  namespace: gh-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: gh-runner
  namespace: gh-runner
